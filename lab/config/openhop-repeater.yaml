# =============================================================================
# openHop Repeater runtime (interop lab, `openhop` compose profile) - contract
# config template.
#
# This committed file is the canonical openHop repeater configuration for the
# hardware-free Docker qualifier. lab/up.sh copies it to
# lab/state/config/openhop-repeater.yaml with the __OPENHOP_*__ placeholders
# substituted, and only when the `openhop` profile is active. The generated
# copy is the one mounted into the openhop-repeater container; the committed
# template is the durable contract and carries NO secrets.
#
# - radio_type: null. The daemon runs with NO RF I/O at all. NullRadio.send()
#   raises by design, so this profile can never claim packet delivery.
# - The companion identity_key and the repeater's own identity_key are
#   PLACEHOLDERS: identities are credentials, so they are generated into the
#   gitignored lab/state/ tree at bring-up and never committed. The repeater's
#   own identity lives in the persistent data volume (identity_file), so it
#   survives a repeater restart; the companion identity_key is substituted
#   into the generated config, so it also survives a restart.
# - The companion exposes the MeshCore frame protocol over TCP. The companion
#   port is NEVER published to the host: it is reachable only on the private
#   compose network the medre-openhop service joins. openHop's companion
#   server accepts ONE client at a time and evicts the previous one, so no
#   readiness probe may ever connect to it.
# - routes are disabled by default (see the `policy`/route sections): the
#   openHop profile qualifies the MEDRE<->companion protocol path, not a
#   routed mesh. Enabling routing is an explicit operator act.
#
# PHASE 3 PARAMETERS (documented, NOT enabled here)
# -------------------------------------------------
# This template deliberately denies every TX path, because Phase 2 must not
# be able to transmit. Two settings must be flipped for the Phase 3
# virtual-packet profile; they are recorded here so the switch is explicit
# rather than discovered:
#   * repeater.mode: "no_tx"  -> "forward"  (the repeater must be able to
#     repeat a packet; "no_tx" turns ALL TX off).
#   * mesh.unscoped_flood_allow / mesh.global_flood_allow: false -> true
#     (unscoped flooding is denied here).
# The MEDRE side has its own switch: the route in lab/config/medre-openhop.yaml
# is `enabled: false` and must be enabled for Phase 3.
#
# CHANNEL 0 IS AUTO-PROVISIONED, THE TEST CHANNEL IS NOT
# -------------------------------------------------
# The repeater auto-creates public channel 0 ("Public", with the default
# public-channel secret) for every companion that does not have it yet, so
# channel 0 always exists. The repeater log therefore reports "restored
# 0/0 channel(s)" on a FIRST start: nothing was persisted yet, and the
# auto-provisioned channel is not a restored one. Phase 3 must PROVISION its
# own test channel (a non-zero index with the lab's channel secret) before
# any packet-path assertion; channel 0 alone is the default public channel,
# not the lab's test channel.
# =============================================================================

repeater:
  # Node name for logging and identification.
  node_name: "openhop-lab-repeater"

  # TX mode: forward | monitor | no_tx (default: forward).
  mode: "no_tx"

  latitude: 0.0
  longitude: 0.0

  # The repeater's own identity lives in the persistent data volume so a
  # repeater restart keeps the same node identity (persistence evidence).
  # Generated by the daemon on first start; never committed.
  identity_file: "/var/lib/openhop_repeater/identity.key"

  owner_info: "medre hardware lab openhop qualifier"

  # Duplicate packet cache TTL in seconds.
  cache_ttl: 3600

  # Automatic advertisement interval in hours. 0 disables adverts (manual
  # only): the qualifier must not emit mesh traffic on its own.
  send_advert_interval_hours: 0
  direct_advert_interval_hours: 0

  # Do not answer discovery requests: the qualifier must stay silent.
  allow_discovery: false

  security:
    # Only one client may hold the companion at a time anyway; this is the
    # HTTP admin surface, which stays closed to the host.
    max_clients: 1
    admin_password: "__OPENHOP_ADMIN_PASSWORD__" # checkov:skip=CKV_SECRET_6:Public deterministic placeholder substituted by lab/up.sh for the isolated lab service.
    guest_password: "__OPENHOP_GUEST_PASSWORD__" # checkov:skip=CKV_SECRET_6:Public deterministic placeholder substituted by lab/up.sh for the isolated lab service.
    allow_read_only: false
    jwt_secret: "__OPENHOP_JWT_SECRET__" # checkov:skip=CKV_SECRET_6:Public deterministic placeholder substituted by lab/up.sh for the isolated lab service.
    jwt_expiry_minutes: 60

# Companion identities. Each companion serves the MeshCore frame protocol
# over TCP to exactly ONE client at a time (a new connection evicts the
# previous one). The lab defines exactly ONE companion so the single-client
# rule is unambiguous.
identities:
  companions:
    - name: "MedreOpenHopCompanion"
      # 32-byte Ed25519 seed in hex. Generated per installation into the
      # gitignored lab/state/ tree; substituted into the generated config.
      identity_key: "__OPENHOP_COMPANION_IDENTITY_KEY__"
      settings:
        node_name: "MEDRE-OPENHOP-QUAL"
        tcp_port: 5000
        # 0.0.0.0 inside the container. The port is NOT published to the
        # host, so this bind is only reachable on the private compose
        # network (see compose.yaml, network `openhop`).
        bind_address: "0.0.0.0"
        tcp_timeout: 120

# NO RADIO. The daemon serves the companion frame protocol without any RF
# I/O. NullRadio.send() raises, so nothing in this profile can transmit.
radio_type: null

radio:
  frequency: 869618000
  tx_power: 14
  bandwidth: 62500
  spreading_factor: 8
  coding_rate: 8
  preamble_length: 32
  implicit_header: false

# Storage: persistent SQLite (companion contacts/channels/messages) plus the
# repeater identity file. The volume survives `docker compose down`.
storage:
  storage_dir: "/var/lib/openhop_repeater"
  retention:
    sqlite_cleanup_days: 31
    companion_events_days: 31

# Mesh behaviour. Flooding is denied so the qualifier never injects unscoped
# traffic into a real mesh if it is ever pointed at one.
mesh:
  unscoped_flood_allow: false
  global_flood_allow: false
  path_hash_mode: 0
  loop_detect: minimal
  default_region: null

# Local GPS receiver: disabled (no hardware in this profile).
gps:
  enabled: false

# Sensors: disabled (no hardware in this profile).
sensors:
  enabled: false
  poll_interval_seconds: 30.0
  auto_install_packages: false
  definitions: []

# Metrics: RRDtool is not installed in the lab image (it needs librrd), so
# the RRDtool archive is disabled; the API still serves live stats.
metrics:
  rrd_enabled: false

# Plugin manager: disabled. The lab image runs the repeater under the
# container supervisor, which would otherwise also start the plugin
# manager process.
plugins:
  enabled: false

# MQTT: no brokers (the qualifier must not publish anywhere).
mqtt_brokers:
  iata_code: "LAB"
  status_interval: 300
  owner: ""
  email: ""
  brokers: []

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# HTTP: the web/API surface stays bound to the container's loopback so it
# is not reachable even on the compose network.
http:
  enabled: true
  host: "127.0.0.1"
  port: 8000
  thread_pool: 4
  thread_pool_max: 8
  socket_timeout: 65
  socket_queue_size: 100

web:
  cors_enabled: false
  carto_api_key: ""
  custom_web_path: null

delays:
  tx_delay_factor: 1.0
  direct_tx_delay_factor: 0.5

duty_cycle:
  enforcement_enabled: false
  max_airtime_per_minute: 3600
