# =============================================================================
# MMRelay / MEDRE canonical interop lab
#
# Two MMRelay dev containers, each wired to its own meshtasticd software node
# PAIRED WITH A PEER NODE (one virtual meshnet per relay: AlphaLab = A+A-peer,
# BetaLab = B+B-peer), bridged through one shared Synapse homeserver.
#
# Compose profiles:
#   (none)     the 2-relay base rig.
#   `medre`    STRESS topology: medre-relay shares BOTH mmrelay meshnets via
#              dedicated a/b-medre nodes (documents the cross-bridge loop).
#   `normal`   NORMAL-DEPLOYMENT topology (loop-free star): medre-normal gets
#              its OWN third meshnet MeshC (GammaLab) on its own docker
#              bridge, plus a loopback-only LXMF/Reticulum leg. See
#              lab/README.md.
#
# Peer nodes exist for (a) a second radio identity on each meshnet and
# (b) injection/witness surfaces that never touch the relay-connected node's
# API (meshtasticd force-closes the previous TCP client on each new API
# connection). Radio injection goes through the peer; the relay hears the
# packet over the simulated air (UDP multicast 224.0.0.69:4403, enabled by
# Config.EnableUDP in lab/config/meshtasticd-config.yaml).
#
# The mmrelay source is consumed READ-ONLY from the host checkout
# (mmrelay-src build context, /src bind mount) and shadowed in via
# PYTHONPATH=/src/src, so branch iteration needs no rebuild.
#
# NOTE on the image pin: the owner directive is to track the DAILY firmware
# channel. meshtasticd 2.7.15 (the CI-pinned digest) does not support
# Config.EnableUDP, which the peer-node mesh requires. Fallback digest of the
# last bring-up that passed is recorded in lab/VERSION.
# =============================================================================
name: medre-lab

x-mmrelay-build: &mmrelay-build
  build:
    context: .
    dockerfile: lab/mmrelay/Dockerfile
    additional_contexts:
      # Read-only build context pointing at the host mmrelay checkout.
      # Use the MMRelay revision selected in sources.lock.json.
      mmrelay-src: ${MMRELAY_SRC:?run medre-lab docker prepare}
      # medre-adapter-matrix override context: the Dockerfile force-reinstalls
      # medre-adapter-matrix FROM THIS CHECKOUT (git+file, direct_url.json
      # carries the exact commit) instead of the pyproject-pinned revision.
      # Same source the medre profiles mount/shadow (MEDRE_MATRIX_SRC), so one
      # variable pins the matrix adapter everywhere it appears in the rig.
      medre-matrix-src: ${MEDRE_MATRIX_SRC:?run medre-lab docker prepare}
      # Separate MMRelay bake core supports an explicitly selected rig pair;
      # it is not evidence for MMRelay's declared dependencies.
      mmrelay-core-src: ${MMRELAY_BAKE_CORE_SRC:?run medre-lab docker prepare}
      # The MEDRE image uses the core checkout selected by the source manifest.
      medre-core-src: ${MEDRE_CORE_SRC:?run medre-lab docker prepare}
    args:
      # Ref resolved inside the checkout; lab/up.sh exports the exact HEAD
      # SHA so a detached checkout is honored verbatim.
      MEDRE_MATRIX_REF: ${MEDRE_MATRIX_REF:-main}
      MEDRE_CORE_REF: ${MEDRE_CORE_REF:-main}
      MMRELAY_BAKE_CORE_REF: ${MMRELAY_BAKE_CORE_REF:-main}
  image: medre-lab/mmrelay-dev:latest

# MEDRE dev image build (profiles `medre` + `normal`). Build contexts are
# resolved by `medre-lab docker prepare` from sources.lock.json and explicit
# overrides. See lab/README.md for the topology and source qualification.
x-medre-build: &medre-build
  build:
    context: .
    dockerfile: lab/medre/Dockerfile
    additional_contexts:
      medre-core-src: ${MEDRE_CORE_SRC:?run medre-lab docker prepare}
      medre-matrix-src: ${MEDRE_MATRIX_SRC:?run medre-lab docker prepare}
      medre-meshtastic-src: ${MEDRE_MESHTASTIC_SRC:?run medre-lab docker prepare}
      medre-lxmf-src: ${MEDRE_LXMF_SRC:?run medre-lab docker prepare}
  image: medre-lab/medre-dev:latest

# ---------------------------------------------------------------------------
# openHop profile build anchors.
#
# The openHop profile is OPT-IN and hardware-free: no radios, no /dev
# mounts, no CAP_SYS_RAWIO, no GPIO/USB groups. It carries its OWN source
# pins (see sources.lock.json): the default rig's medre 0.1.0 pin cannot
# satisfy medre-adapter-meshcore 0.2.0 (`medre>=0.2.0,<0.3.0`), so the
# openHop profile gets a second MEDRE build anchor and separate checkouts.
#
# x-openhop-repeater-build: the LAB-OWNED openHop image (lab/openhop/
# Dockerfile). It installs the pinned local openhop_core and then the pinned
# local openhop_repeater checkout, and stamps both commits into the image
# (openhop-bake-pin.json) so the installed source is provable in-container.
x-openhop-repeater-build: &openhop-repeater-build
  build:
    context: .
    dockerfile: lab/openhop/Dockerfile
    additional_contexts:
      openhop-core-src: ${OPENHOP_CORE_SRC:?run medre-lab docker prepare}
      openhop-repeater-src: ${OPENHOP_REPEATER_SRC:?run medre-lab docker prepare}
    args:
      # Exact HEAD SHAs, exported by lab/up.sh from the checkouts.
      OPENHOP_CORE_REF: ${OPENHOP_CORE_REF:-main}
      OPENHOP_REPEATER_REF: ${OPENHOP_REPEATER_REF:-main}
      OPENHOP_CORE_VERSION: ${OPENHOP_CORE_VERSION:-1.1.3}
      OPENHOP_REPEATER_VERSION: ${OPENHOP_REPEATER_VERSION:-1.1.4}
  image: medre-lab/openhop-repeater:latest

# x-medre-openhop-build: the SECOND MEDRE image (lab/medre-openhop/
# Dockerfile): medre 0.2.3 + meshcore adapter 0.2.0 + meshtastic adapter
# 0.2.1. No matrix and no lxmf adapter (the openHop profile does not use
# Matrix rooms).
x-medre-openhop-build: &medre-openhop-build
  build:
    context: .
    dockerfile: lab/medre-openhop/Dockerfile
    additional_contexts:
      medre-openhop-src: ${MEDRE_OPENHOP_SRC:?run medre-lab docker prepare}
      medre-meshcore-src: ${MEDRE_MESHCORE_SRC:?run medre-lab docker prepare}
      medre-meshtastic-openhop-src: ${MEDRE_MESHTASTIC_OPENHOP_SRC:?run medre-lab docker prepare}
  image: medre-lab/medre-openhop-dev:latest

x-mmrelay-common: &mmrelay-common
  <<: *mmrelay-build
  restart: unless-stopped
  stop_grace_period: 30s
  user: "1000:1000"
  environment:
    PYTHONUNBUFFERED: "1"
    MMRELAY_READY_FILE: /tmp/mmrelay-ready
    TZ: UTC
  # Branch source mounted read-only: the baked install (deps + package
  # metadata) is shadowed by PYTHONPATH=/src/src at runtime.
  healthcheck:
    test:
      [
        CMD-SHELL,
        "find $${MMRELAY_READY_FILE:-/tmp/mmrelay-ready} -mmin -2 | grep -q .",
      ]
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 30s

# meshtasticd nodes run WITHOUT -s: the -s flag short-circuits config-file
# loading (PortduinoGlue force_simradio branch), which would silently disable
# Config.EnableUDP and thus all cross-node sim-radio meshing.
#
# Unprivileged runtime: upstream meshtasticd ships no /data and runs as root.
# The derived image (lab/meshtasticd/Dockerfile, digest-pinned FROM the
# upstream daily) pre-owns /data and /var/lib/meshtasticd for uid 1000, so
# fresh named volumes seed 1000-owned state and meshtasticd writes
# (--fsdir=/data) as uid 1000 with no root anywhere in the bring-up path.
# The tmpfs over /var/lib/meshtasticd (unused when --fsdir=/data) also stops
# the image's VOLUME declaration minting an orphaned anonymous volume per
# container.
x-meshtasticd-common: &meshtasticd-common
  build:
    context: lab/meshtasticd
    dockerfile: Dockerfile
  image: medre-lab/meshtasticd-lab:latest
  pull_policy: never
  user: "1000:1000"
  tmpfs:
    - /var/lib/meshtasticd
  restart: unless-stopped
  healthcheck:
    # NEVER probe the TCP API port: the API server keeps a single client
    # and force-closes the standing one on each new connection, so a
    # port-probe healthcheck evicts the relay (relay nodes) or an armed
    # sniffer (peer nodes) every interval. Process liveness via /proc only.
    test:
      [
        CMD-SHELL,
        'bash -c ''for p in /proc/[0-9]*/comm; do grep -q meshtasticd "$$p" && exit 0; done; exit 1''',
      ]
    interval: 5s
    timeout: 5s
    retries: 36
    start_period: 15s

services:
  synapse:
    # Unprivileged runtime: upstream Synapse ships no /data and its start.py
    # bootstraps state via root chown+gosu (991:991). The derived image
    # (lab/synapse/Dockerfile, digest-pinned FROM the upstream v1.149.0)
    # pre-owns /data as 991:991 — the image's documented runtime user — so the
    # entrypoint runs directly as 991:991 (with a non-root uid start.py skips
    # the chown/gosu entirely) and fresh named volumes seed 991-owned state.
    # Reused volumes must be writable by the configured service identity.
    build:
      context: lab/synapse
      dockerfile: Dockerfile
    image: medre-lab/synapse-lab:latest
    pull_policy: never
    user: "991:991"
    container_name: medre-lab-synapse
    restart: unless-stopped
    environment:
      SYNAPSE_SERVER_NAME: lab.test
      SYNAPSE_REPORT_STATS: "no"
      TZ: UTC
    ports:
      # Loopback only: the lab is a local, untrusted-input-safe environment.
      - "127.0.0.1:${LAB_MATRIX_PORT:-8008}:8008"
    volumes:
      - synapse-data:/data
    networks:
      - matrix
    healthcheck:
      test:
        [
          CMD-SHELL,
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8008/_matrix/client/versions'', timeout=5)"',
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  meshtasticd-a:
    <<: *meshtasticd-common
    container_name: medre-lab-mesh-a
    command: ["meshtasticd", "--fsdir=/data", "-p", "4403", "-h", "11"]
    ports:
      - "127.0.0.1:4403:4403"
    volumes:
      - type: bind
        source: ./lab/config/meshtasticd-config.yaml
        target: /etc/meshtasticd/config.yaml
        read_only: true
      - mesh-a-node:/data
    networks: [mesh-a]

  meshtasticd-a-peer:
    <<: *meshtasticd-common
    container_name: medre-lab-mesh-a-peer
    command: ["meshtasticd", "--fsdir=/data", "-p", "4403", "-h", "21"]
    ports:
      - "127.0.0.1:4405:4403"
    volumes:
      - type: bind
        source: ./lab/config/meshtasticd-config.yaml
        target: /etc/meshtasticd/config.yaml
        read_only: true
      - mesh-a-peer-node:/data
    networks: [mesh-a]

  meshtasticd-b:
    <<: *meshtasticd-common
    container_name: medre-lab-mesh-b
    command: ["meshtasticd", "--fsdir=/data", "-p", "4403", "-h", "22"]
    ports:
      - "127.0.0.1:4404:4403"
    volumes:
      - type: bind
        source: ./lab/config/meshtasticd-config.yaml
        target: /etc/meshtasticd/config.yaml
        read_only: true
      - mesh-b-node:/data
    networks: [mesh-b]

  meshtasticd-b-peer:
    <<: *meshtasticd-common
    container_name: medre-lab-mesh-b-peer
    command: ["meshtasticd", "--fsdir=/data", "-p", "4403", "-h", "32"]
    ports:
      - "127.0.0.1:4406:4403"
    volumes:
      - type: bind
        source: ./lab/config/meshtasticd-config.yaml
        target: /etc/meshtasticd/config.yaml
        read_only: true
      - mesh-b-peer-node:/data
    networks: [mesh-b]

  mmrelay-a:
    <<: *mmrelay-common
    container_name: medre-lab-mmrelay-a
    command:
      [
        "python",
        "-m",
        "mmrelay.cli",
        "--config",
        "/config/mmrelay-a.yaml",
        "--home",
        "/data",
        "--log-level",
        "debug",
      ]
    # Per-relay volumes: /config bind (generated relay configs), /src bind
    # (branch checkout, read-only), state named volume (nio store, SQLite,
    # logs) mounted at MMRELAY home /data, echo_observed scenario plugin,
    # and the shared lab-logs bind (plugin observation output).
    volumes:
      - type: bind
        source: ./lab/state/config
        target: /config
        read_only: true
      - type: bind
        source: ${MMRELAY_SRC:?run medre-lab docker prepare}
        target: /src
        read_only: true
      - type: bind
        source: ./lab/plugins/echo_observed.py
        target: /data/plugins/custom/echo_observed.py
        read_only: true
      - type: bind
        source: ./lab/logs
        target: /lab-logs
      - mmrelay-a-state:/data
    environment:
      PYTHONUNBUFFERED: "1"
      MMRELAY_READY_FILE: /tmp/mmrelay-ready
      TZ: UTC
      ECHO_OBSERVED_PATH: /lab-logs/scenarios/echo-observed-a.jsonl
    networks: [matrix, mesh-a]
    depends_on:
      synapse:
        condition: service_healthy
      meshtasticd-a:
        condition: service_healthy

  mmrelay-b:
    <<: *mmrelay-common
    container_name: medre-lab-mmrelay-b
    command:
      [
        "python",
        "-m",
        "mmrelay.cli",
        "--config",
        "/config/mmrelay-b.yaml",
        "--home",
        "/data",
        "--log-level",
        "debug",
      ]
    volumes:
      - type: bind
        source: ./lab/state/config
        target: /config
        read_only: true
      - type: bind
        source: ${MMRELAY_SRC:?run medre-lab docker prepare}
        target: /src
        read_only: true
      - type: bind
        source: ./lab/plugins/echo_observed.py
        target: /data/plugins/custom/echo_observed.py
        read_only: true
      - type: bind
        source: ./lab/logs
        target: /lab-logs
      - mmrelay-b-state:/data
    environment:
      PYTHONUNBUFFERED: "1"
      MMRELAY_READY_FILE: /tmp/mmrelay-ready
      TZ: UTC
      ECHO_OBSERVED_PATH: /lab-logs/scenarios/echo-observed-b.jsonl
    networks: [matrix, mesh-b]
    depends_on:
      synapse:
        condition: service_healthy
      meshtasticd-b:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # MEDRE bridge profile: dedicated meshtasticd nodes + one medre relay.
  #
  # HARD RULE (owner-set): ONE api client per meshtasticd node. meshtasticd
  # force-closes the standing TCP client on every new connection and the
  # python transport auto-reconnects and fights. These nodes are therefore
  # DEDICATED: meshtasticd-a-medre is owned exclusively by medre-relay
  # (radio-a), meshtasticd-b-medre exclusively by medre-relay (radio-b) —
  # never shared with mmrelay-a/b or the peer nodes. Healthchecks are /proc
  # process scans (never TCP probes: a probe evicts the client every
  # interval). Host ports 4407/4408 are loopback debugging conveniences ONLY;
  # nothing in the lab connects to them while the relay is up.
  # -------------------------------------------------------------------------
  meshtasticd-a-medre:
    <<: *meshtasticd-common
    profiles: [medre]
    container_name: medre-lab-mesh-a-medre
    command: ["meshtasticd", "--fsdir=/data", "-p", "4403", "-h", "41"]
    ports:
      - "127.0.0.1:4407:4403"
    volumes:
      - type: bind
        source: ./lab/config/meshtasticd-config.yaml
        target: /etc/meshtasticd/config.yaml
        read_only: true
      - mesh-a-medre-node:/data
    networks: [mesh-a]

  meshtasticd-b-medre:
    <<: *meshtasticd-common
    profiles: [medre]
    container_name: medre-lab-mesh-b-medre
    command: ["meshtasticd", "--fsdir=/data", "-p", "4403", "-h", "52"]
    ports:
      - "127.0.0.1:4408:4403"
    volumes:
      - type: bind
        source: ./lab/config/meshtasticd-config.yaml
        target: /etc/meshtasticd/config.yaml
        read_only: true
      - mesh-b-medre-node:/data
    networks: [mesh-b]

  # -------------------------------------------------------------------------
  # NORMAL-DEPLOYMENT profile (star topology; see lab/README.md). MeshC is a
  # THIRD virtual meshnet on its own docker bridge: medre-normal owns the
  # dedicated primary node (one API client per node) and the peer node is the
  # tooling injection/witness surface. mmrelay-a/b keep their Alpha/Beta
  # meshnets; the three meshes are L2-isolated from each other, so every
  # bridge sits on its OWN mesh (loop-free star: no bridge shares a meshnet
  # with another bridge, which is what closed the cross-bridge loop under the
  # stress `medre` profile). Same pinned daily image + sim-radio config +
  # /proc healthcheck as every other node.
  # -------------------------------------------------------------------------
  meshtasticd-c-medre:
    <<: *meshtasticd-common
    # `normal` owns this node for medre-normal; `openhop` owns it for
    # medre-openhop. The two profiles are mutually exclusive (lab/up.sh
    # refuses to run them together), so the one-api-client-per-node rule
    # holds: exactly one MEDRE instance connects to this node at a time.
    profiles: [normal, openhop, openhop-bridge]
    container_name: medre-lab-mesh-c-medre
    command: ["meshtasticd", "--fsdir=/data", "-p", "4403", "-h", "63"]
    ports:
      - "127.0.0.1:4409:4403"
    volumes:
      - type: bind
        source: ./lab/config/meshtasticd-config.yaml
        target: /etc/meshtasticd/config.yaml
        read_only: true
      - mesh-c-medre-node:/data
    networks: [mesh-c]

  meshtasticd-c-peer:
    <<: *meshtasticd-common
    profiles: [normal, openhop-bridge]
    container_name: medre-lab-mesh-c-peer
    command: ["meshtasticd", "--fsdir=/data", "-p", "4403", "-h", "74"]
    ports:
      - "127.0.0.1:4410:4403"
    volumes:
      - type: bind
        source: ./lab/config/meshtasticd-config.yaml
        target: /etc/meshtasticd/config.yaml
        read_only: true
      - mesh-c-peer-node:/data
    networks: [mesh-c]

  # One medre runtime for the NORMAL deployment: ONE matrix adapter
  # (@medre:lab.test, bot account shared with the stress profile's relay —
  # every lab/up.sh-orchestrated bring-up cross-stops the OTHER mode's medre
  # containers first, so the two instances never coexist on an up.sh path;
  # invoking raw `docker compose` with both profiles active is NOT guarded
  # and would double-book the bot account), ONE
  # meshtastic adapter (radio-c -> meshtasticd-c-medre on MeshC), and ONE
  # lxmf adapter (loopback-only Reticulum UDPInterface pair inside the
  # container network namespace; no hardware, no egress). The LXMF adapter
  # code ships read-only from the r15q-lxmf worktree; RNS/LXMF deps are
  # baked by lab/medre/Dockerfile.
  medre-normal:
    <<: *medre-build
    profiles: [normal]
    container_name: medre-lab-medre-normal
    restart: unless-stopped
    stop_grace_period: 30s
    user: "1000:1000"
    command: ["medre", "run", "--config", "/config/medre-normal.yaml"]
    environment:
      MEDRE_HOME: /data
      PYTHONUNBUFFERED: "1"
      TZ: UTC
      # Candidate worktrees shadow the baked install (pkgutil namespace
      # merging; core src first). lxmf LAST: it contributes the
      # medre.adapters.lxmf portion of the namespace only.
      PYTHONPATH: /src/core/src:/src/matrix/src:/src/meshtastic/src:/src/lxmf/src
    volumes:
      - type: bind
        source: ./lab/state/config
        target: /config
        read_only: true
      - type: bind
        source: ${MEDRE_CORE_SRC:?run medre-lab docker prepare}
        target: /src/core
        bind:
          create_host_path: false
        read_only: true
      - type: bind
        source: ${MEDRE_MATRIX_SRC:?run medre-lab docker prepare}
        target: /src/matrix
        bind:
          create_host_path: false
        read_only: true
      - type: bind
        source: ${MEDRE_MESHTASTIC_SRC:?run medre-lab docker prepare}
        target: /src/meshtastic
        bind:
          create_host_path: false
        read_only: true
      - type: bind
        source: ${MEDRE_LXMF_SRC:?run medre-lab docker prepare}
        target: /src/lxmf
        bind:
          create_host_path: false
        read_only: true
      # Lab tools (lxmf counterpart driver + peer bootstrap), read-only.
      - type: bind
        source: ./lab/tools
        target: /opt/lab-tools
        read_only: true
      # Reticulum config template for medre's embedded RNS (loopback-only
      # UDPInterface half); lab/up.sh seeds it into /data/reticulum in the
      # state volume at bring-up (RNS writes a DEFAULT config if the dir is
      # empty, which would silently drop the loopback interface).
      - type: bind
        source: ./lab/config/reticulum
        target: /config-reticulum
        read_only: true
      # LXMF counterpart material on the host (peer identity, peer Reticulum
      # config). medre itself never writes here; the counterpart driver does.
      - type: bind
        source: ./lab/state/lxmf
        target: /data-lxmf
      - medre-normal-state:/data
    # Process-liveness healthcheck via /proc only (never TCP: a probe would
    # evict the node's single API client; same rationale as medre-relay).
    healthcheck:
      test:
        [
          CMD-SHELL,
          "bash -c 'for p in /proc/[0-9]*/cmdline; do tr \"\\0\" \"\\n\" < \"$$p\" | grep -qx \"/usr/local/bin/medre\" && exit 0; done; exit 1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s
    networks: [matrix, mesh-c]
    depends_on:
      synapse:
        condition: service_healthy
      meshtasticd-c-medre:
        condition: service_healthy

  # One medre runtime: ONE matrix adapter (@medre:lab.test) + TWO meshtastic
  # adapter instances (radio-a -> meshtasticd-a-medre on AlphaLab, radio-b ->
  # meshtasticd-b-medre on BetaLab). The runtime supports multiple instances
  # per transport kind (see medre examples/configs/docker-bridge-smoke.yaml,
  # which holds two matrix + two meshtastic instances in one process).
  medre-relay:
    <<: *medre-build
    profiles: [medre]
    container_name: medre-lab-medre-relay
    restart: unless-stopped
    stop_grace_period: 30s
    user: "1000:1000"
    command: ["medre", "run", "--config", "/config/medre-relay.yaml"]
    environment:
      MEDRE_HOME: /data
      PYTHONUNBUFFERED: "1"
      TZ: UTC
      # Candidate worktrees shadow the baked install (pkgutil namespace
      # merging; core src first). Mirrors the mmrelay PYTHONPATH dev pattern.
      PYTHONPATH: /src/core/src:/src/matrix/src:/src/meshtastic/src
    volumes:
      - type: bind
        source: ./lab/state/config
        target: /config
        read_only: true
      - type: bind
        source: ${MEDRE_CORE_SRC:?run medre-lab docker prepare}
        target: /src/core
        bind:
          create_host_path: false
        read_only: true
      - type: bind
        source: ${MEDRE_MATRIX_SRC:?run medre-lab docker prepare}
        target: /src/matrix
        bind:
          create_host_path: false
        read_only: true
      - type: bind
        source: ${MEDRE_MESHTASTIC_SRC:?run medre-lab docker prepare}
        target: /src/meshtastic
        bind:
          create_host_path: false
        read_only: true
      - medre-state:/data
    # Process-liveness healthcheck via /proc only. The exact-line match
    # (`grep -qx '/usr/local/bin/medre'`) reads the relay process's
    # NUL-separated argv, so the healthcheck shell's own cmdline (one long
    # line containing the pattern as a substring) cannot match. No TCP
    # probes anywhere in this lab's healthchecks.
    healthcheck:
      test:
        [
          CMD-SHELL,
          "bash -c 'for p in /proc/[0-9]*/cmdline; do tr \"\\0\" \"\\n\" < \"$$p\" | grep -qx \"/usr/local/bin/medre\" && exit 0; done; exit 1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s
    networks: [matrix, mesh-a, mesh-b]
    depends_on:
      synapse:
        condition: service_healthy
      meshtasticd-a-medre:
        condition: service_healthy
      meshtasticd-b-medre:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # openHop profile (OPT-IN; profile `openhop`).
  #
  # Hardware-free MEDRE<->openHop qualifier.
  #
  #   openhop-repeater  the openHop repeater with radio_type: null. It
  #                     serves the MeshCore companion frame protocol over
  #                     TCP 5000 on the private `openhop` network.
  #   medre-openhop     the MEDRE runtime whose MeshCore adapter talks to
  #                     that companion, plus the existing MeshC meshtastic
  #                     sim endpoint.
  #
  # HARD RULES (owner-set):
  #   * The companion TCP port is NEVER published to the host. It exists
  #     only on the private `openhop` compose network.
  #   * openHop's companion server accepts ONE client at a time and evicts
  #     the previous one. Therefore NO healthcheck, readiness probe or
  #     test may connect to port 5000 while MEDRE holds the companion.
  #     Both healthchecks below are PROCESS LIVENESS ONLY.
  #   * No /dev mounts, no devices:, no cap_add, no GPIO/USB groups: this
  #     profile never touches radio hardware.
  #   * The repeater's own identity and the companion's identity are
  #     generated at bring-up into the gitignored lab/state/ tree; they
  #     are credentials and never live in git.
  # -------------------------------------------------------------------------
  openhop-repeater:
    <<: *openhop-repeater-build
    profiles: [openhop]
    container_name: medre-lab-openhop-repeater
    restart: unless-stopped
    stop_grace_period: 30s
    user: "1000:1000"
    command:
      [
        "python3",
        "-m",
        "repeater.plugins.container_supervisor",
        "--config",
        "/etc/openhop_repeater/config.yaml",
      ]
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: UTC
      # Persistent state: SQLite companion store + the repeater identity
      # file. The volume survives `docker compose down`.
      DATA_DIR: /var/lib/openhop_repeater
    volumes:
      # The generated config (from lab/config/openhop-repeater.yaml with
      # the identity/credential placeholders substituted). Read-only: the
      # repeater never rewrites the contract config.
      - type: bind
        source: ./lab/state/config/openhop-repeater.yaml
        target: /etc/openhop_repeater/config.yaml
        read_only: true
      # Pinned local checkouts, mounted read-only and shadowing the baked
      # install via PYTHONPATH (same dev-shadowing pattern as the MEDRE
      # image): the running code IS the pinned checkout.
      - type: bind
        source: ${OPENHOP_CORE_SRC:?run medre-lab docker prepare}
        target: /src/openhop-core
        bind:
          create_host_path: false
        read_only: true
      - type: bind
        source: ${OPENHOP_REPEATER_SRC:?run medre-lab docker prepare}
        target: /src/openhop-repeater
        bind:
          create_host_path: false
        read_only: true
      - openhop-repeater-data:/var/lib/openhop_repeater
    # Process-liveness healthcheck via /proc only. NEVER probe the
    # companion TCP port: the companion accepts one client at a time and
    # evicts the standing one, so a port probe would evict MEDRE.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'for p in /proc/[0-9]*/cmdline; do tr \"\\0\" \"\\n\" < \"$$p\" | grep -qx \"repeater.main\" && exit 0; done; exit 1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s
    networks: [openhop]

  medre-openhop:
    <<: *medre-openhop-build
    profiles: [openhop]
    container_name: medre-lab-medre-openhop
    restart: unless-stopped
    stop_grace_period: 30s
    user: "1000:1000"
    command: ["medre", "run", "--config", "/config/medre-openhop.yaml"]
    environment:
      MEDRE_HOME: /data
      PYTHONUNBUFFERED: "1"
      TZ: UTC
      # Core src FIRST so its pkgutil.extend_path medre/__init__.py wins
      # the namespace import and merges the adapter portions.
      PYTHONPATH: /src/core/src:/src/meshcore/src:/src/meshtastic/src
    volumes:
      - type: bind
        source: ./lab/state/config
        target: /config
        read_only: true
      - type: bind
        source: ${MEDRE_OPENHOP_SRC:?run medre-lab docker prepare}
        target: /src/core
        bind:
          create_host_path: false
        read_only: true
      - type: bind
        source: ${MEDRE_MESHCORE_SRC:?run medre-lab docker prepare}
        target: /src/meshcore
        bind:
          create_host_path: false
        read_only: true
      - type: bind
        source: ${MEDRE_MESHTASTIC_OPENHOP_SRC:?run medre-lab docker prepare}
        target: /src/meshtastic
        bind:
          create_host_path: false
        read_only: true
      - medre-openhop-state:/data
    # Process-liveness healthcheck via /proc only (never TCP: a probe
    # would evict the companion's single client).
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'for p in /proc/[0-9]*/cmdline; do tr \"\\0\" \"\\n\" < \"$$p\" | grep -qx \"/usr/local/bin/medre\" && exit 0; done; exit 1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s
    networks: [openhop, mesh-c]
    depends_on:
      openhop-repeater:
        condition: service_healthy
      meshtasticd-c-medre:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # openHop VIRTUAL RADIO profile (OPT-IN; profile `openhop-radio`).
  #
  # Hardware-free proof that REAL MeshCore packets cross between two
  # openHop repeaters. The RF MEDIUM is simulated by a lab-owned asyncio
  # service speaking the openHop Modem protocol; the packets themselves are
  # real (encrypted by one repeater, decrypted by the other).
  #
  #   openhop-radio-relay    the lab's virtual radio relay (asyncio TCP
  #                          server, openHop Modem protocol). Lab-owned
  #                          code; no openHop radio backend is touched.
  #   openhop-repeater-a     openHop repeater with radio_type: modem_tcp,
  #                          pointed at the relay. Mode `monitor`.
  #   openhop-repeater-b     the peer repeater (same, own identity, own
  #                          volume, own companion).
  #   openhop-radio-probe    one-shot proof container (pinned meshcore
  #                          2.3.15 SDK) that sends a channel-0 nonce at B
  #                          and expects exactly one CHANNEL_MSG_RECV at A.
  #
  # HARD RULES (owner-set):
  #   * NO host ports: the companion TCP ports and the relay live only on
  #     the private `openhop-radio` network.
  #   * The relay accepts EXACTLY two clients (the two repeaters' radios).
  #     A TCP healthcheck would occupy a client slot and evict a repeater,
  #     so every healthcheck below is PROCESS LIVENESS ONLY.
  #   * No /dev mounts, no devices:, no cap_add, no GPIO/USB groups.
  #   * The Phase 2 `openhop` profile is untouched by this one.
  # -------------------------------------------------------------------------
  openhop-radio-relay:
    build:
      context: .
      dockerfile: lab/openhop-radio/Dockerfile
    image: medre-lab/openhop-radio-relay:latest
    profiles: [openhop-radio, openhop-bridge]
    container_name: medre-lab-openhop-radio-relay
    restart: unless-stopped
    stop_grace_period: 15s
    user: "1000:1000"
    command:
      [
        "python3",
        "/app/openhop_radio_relay.py",
        "--host",
        "0.0.0.0",
        "--port",
        "5055",
      ]
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: UTC
    # Process-liveness healthcheck via /proc only. NEVER TCP-probe the
    # relay: it holds exactly two client slots (the two repeaters' radios)
    # and a probe connection would evict a repeater.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'for p in /proc/[0-9]*/cmdline; do tr \"\\0\" \"\\n\" < \"$$p\" | grep -qx \"/app/openhop_radio_relay.py\" && exit 0; done; exit 1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks: [openhop-radio]

  openhop-repeater-a:
    <<: *openhop-repeater-build
    profiles: [openhop-radio, openhop-bridge]
    container_name: medre-lab-openhop-repeater-a
    restart: unless-stopped
    stop_grace_period: 30s
    user: "1000:1000"
    command:
      [
        "python3",
        "-m",
        "repeater.plugins.container_supervisor",
        "--config",
        "/etc/openhop_repeater/config.yaml",
      ]
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: UTC
      DATA_DIR: /var/lib/openhop_repeater
    volumes:
      - type: bind
        source: ./lab/state/config/openhop-radio-repeater-a.yaml
        target: /etc/openhop_repeater/config.yaml
        read_only: true
      - type: bind
        source: ${OPENHOP_CORE_SRC:?run medre-lab docker prepare}
        target: /src/openhop-core
        bind:
          create_host_path: false
        read_only: true
      - type: bind
        source: ${OPENHOP_REPEATER_SRC:?run medre-lab docker prepare}
        target: /src/openhop-repeater
        bind:
          create_host_path: false
        read_only: true
      - openhop-radio-a-data:/var/lib/openhop_repeater
    # Process-liveness healthcheck via /proc only: the companion TCP port
    # accepts one client at a time and a probe would evict it.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'for p in /proc/[0-9]*/cmdline; do tr \"\\0\" \"\\n\" < \"$$p\" | grep -qx \"repeater.main\" && exit 0; done; exit 1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s
    networks: [openhop-radio]
    depends_on:
      openhop-radio-relay:
        condition: service_healthy

  openhop-repeater-b:
    <<: *openhop-repeater-build
    profiles: [openhop-radio, openhop-bridge]
    container_name: medre-lab-openhop-repeater-b
    restart: unless-stopped
    stop_grace_period: 30s
    user: "1000:1000"
    command:
      [
        "python3",
        "-m",
        "repeater.plugins.container_supervisor",
        "--config",
        "/etc/openhop_repeater/config.yaml",
      ]
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: UTC
      DATA_DIR: /var/lib/openhop_repeater
    volumes:
      - type: bind
        source: ./lab/state/config/openhop-radio-repeater-b.yaml
        target: /etc/openhop_repeater/config.yaml
        read_only: true
      - type: bind
        source: ${OPENHOP_CORE_SRC:?run medre-lab docker prepare}
        target: /src/openhop-core
        bind:
          create_host_path: false
        read_only: true
      - type: bind
        source: ${OPENHOP_REPEATER_SRC:?run medre-lab docker prepare}
        target: /src/openhop-repeater
        bind:
          create_host_path: false
        read_only: true
      - openhop-radio-b-data:/var/lib/openhop_repeater
    # Process-liveness healthcheck via /proc only (see repeater A).
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'for p in /proc/[0-9]*/cmdline; do tr \"\\0\" \"\\n\" < \"$$p\" | grep -qx \"repeater.main\" && exit 0; done; exit 1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s
    networks: [openhop-radio]
    depends_on:
      openhop-radio-relay:
        condition: service_healthy

  openhop-radio-probe:
    <<: *medre-openhop-build
    profiles: [openhop-radio]
    # NO container_name: this service is run one-shot (`compose run`), and
    # `run` cannot use a fixed container name.
    restart: "no"
    user: "1000:1000"
    command:
      [
        "python3",
        "/opt/openhop-radio/openhop_radio_probe.py",
        "--host-a",
        "openhop-repeater-a",
        "--port-a",
        "5000",
        "--host-b",
        "openhop-repeater-b",
        "--port-b",
        "5000",
      ]
    volumes:
      - type: bind
        source: ./lab/tools/openhop_radio_probe.py
        target: /opt/openhop-radio/openhop_radio_probe.py
        read_only: true
    networks: [openhop-radio]
    depends_on:
      openhop-repeater-a:
        condition: service_healthy
      openhop-repeater-b:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # openHop BRIDGE profile (OPT-IN; profile `openhop-bridge`).
  #
  # Phase 3B: MEDRE bridges the openHop radio overlay and MeshC:
  #
  #   virtual MC peer (SDK) --TCP 5000--> openhop-repeater-b --+
  #                                                             | modem relay (lab)
  #   MEDRE (meshcore) --TCP 5000--------> openhop-repeater-a --+
  #                                                             | TCP 4403
  #                             meshtasticd-c-medre -- MeshC -- meshtasticd-c-peer
  #
  #   medre-openhop-bridge  the MEDRE runtime whose meshcore adapter is
  #                          the ONLY client of companion A and whose
  #                          meshtastic adapter is the only API client of
  #                          meshtasticd-c-medre. The bidirectional route
  #                          openhop-a <-> radio-c is enabled ONLY in this
  #                          profile's config (lab/config/
  #                          medre-openhop-bridge.yaml).
  #   openhop-bridge-probe  the one-shot proof container: the virtual
  #                          MeshCore peer (only client of companion B)
  #                          plus the independent MeshC observer/injector
  #                          on meshtasticd-c-peer.
  #
  # HARD RULES (owner-set):
  #   * NO host ports: the companion TCP ports, the relay and the MeshC
  #     sim nodes live only on the private compose networks.
  #   * The companion servers accept ONE client at a time and evict the
  #     previous one: NO healthcheck, readiness probe or test may connect
  #     to port 5000 while a client is attached. Every healthcheck here
  #     is PROCESS LIVENESS ONLY.
  #   * The mesh-c sim nodes accept ONE TCP API client at a time:
  #     MEDRE owns meshtasticd-c-medre, the probe owns
  #     meshtasticd-c-peer.
  #   * No /dev mounts, no devices:, no cap_add, no GPIO/USB groups.
  # -------------------------------------------------------------------------
  medre-openhop-bridge:
    <<: *medre-openhop-build
    profiles: [openhop-bridge]
    container_name: medre-lab-medre-openhop-bridge
    restart: unless-stopped
    stop_grace_period: 30s
    user: "1000:1000"
    command: ["medre", "run", "--config", "/config/medre-openhop-bridge.yaml"]
    environment:
      MEDRE_HOME: /data
      PYTHONUNBUFFERED: "1"
      TZ: UTC
      # Core src FIRST so its pkgutil.extend_path medre/__init__.py wins
      # the namespace import and merges the adapter portions.
      PYTHONPATH: /src/core/src:/src/meshcore/src:/src/meshtastic/src
    volumes:
      - type: bind
        source: ./lab/state/config
        target: /config
        read_only: true
      - type: bind
        source: ${MEDRE_OPENHOP_SRC:?run medre-lab docker prepare}
        target: /src/core
        bind:
          create_host_path: false
        read_only: true
      - type: bind
        source: ${MEDRE_MESHCORE_SRC:?run medre-lab docker prepare}
        target: /src/meshcore
        bind:
          create_host_path: false
        read_only: true
      - type: bind
        source: ${MEDRE_MESHTASTIC_OPENHOP_SRC:?run medre-lab docker prepare}
        target: /src/meshtastic
        bind:
          create_host_path: false
        read_only: true
      - medre-openhop-bridge-state:/data
    # Process-liveness healthcheck via /proc only (never TCP: a probe
    # would evict the companion's single client).
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'for p in /proc/[0-9]*/cmdline; do tr \"\\0\" \"\\n\" < \"$$p\" | grep -qx \"/usr/local/bin/medre\" && exit 0; done; exit 1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s
    networks: [openhop-radio, mesh-c]
    depends_on:
      openhop-repeater-a:
        condition: service_healthy
      meshtasticd-c-medre:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # MEDRE under the fault splice (OPT-IN; profile `openhop-fault`).
  #
  # This is the Phase 3B MEDRE runtime with ONE difference: its meshcore
  # adapter's peer is the fault proxy, so the companion link can be made
  # slow, lossy or broken without touching openHop's code.
  #
  # The companion still sees ONE client at a time: this container is the
  # spliced client, and the bridge MEDRE must be stopped while it runs.
  # -------------------------------------------------------------------------
  medre-openhop-fault:
    <<: *medre-openhop-build
    profiles: [openhop-fault]
    container_name: medre-lab-medre-openhop-fault
    restart: unless-stopped
    stop_grace_period: 30s
    user: "1000:1000"
    command: ["medre", "run", "--config", "/config/medre-openhop-fault.yaml"]
    environment:
      MEDRE_HOME: /data
      PYTHONUNBUFFERED: "1"
      TZ: UTC
      PYTHONPATH: /src/core/src:/src/meshcore/src:/src/meshtastic/src
    volumes:
      - type: bind
        source: ./lab/state/config
        target: /config
        read_only: true
      - type: bind
        source: ${MEDRE_OPENHOP_SRC:?run medre-lab docker prepare}
        target: /src/core
        bind:
          create_host_path: false
        read_only: true
      - type: bind
        source: ${MEDRE_MESHCORE_SRC:?run medre-lab docker prepare}
        target: /src/meshcore
        bind:
          create_host_path: false
        read_only: true
      - type: bind
        source: ${MEDRE_MESHTASTIC_OPENHOP_SRC:?run medre-lab docker prepare}
        target: /src/meshtastic
        bind:
          create_host_path: false
        read_only: true
      - medre-openhop-fault-state:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'for p in /proc/[0-9]*/cmdline; do tr \"\\0\" \"\\n\" < \"$$p\" | grep -qx \"/usr/local/bin/medre\" && exit 0; done; exit 1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s
    networks: [openhop-radio, mesh-c]
    depends_on:
      openhop-repeater-a:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # openHop FAULT PROXY profile (OPT-IN; profile `openhop-fault`).
  #
  # A TRANSPARENT single-connection TCP splice between the MEDRE client and
  # openhop-repeater-a:5000.  It forwards every byte in both directions
  # unchanged and can inject a bounded, scripted fault on the
  # server -> client direction (delay, drop, close mid-fetch, stall).
  #
  # It is NOT a MeshCore client: it never speaks the companion protocol, so
  # it cannot issue a GET_MSG and cannot stack one on another.  The companion
  # sees exactly one client (the spliced MEDRE session) at a time.
  #
  # No host ports: the splice is reachable only on the private compose
  # network.
  # -------------------------------------------------------------------------
  openhop-fault-proxy:
    <<: *medre-openhop-build
    profiles: [openhop-fault]
    container_name: medre-lab-openhop-fault-proxy
    restart: "no"
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    command:
      [
        "python3",
        "/opt/openhop-fault/openhop_fault_proxy.py",
        "--listen-host",
        "0.0.0.0",
        "--listen-port",
        "5050",
        "--upstream-host",
        "openhop-repeater-a",
        "--upstream-port",
        "5000",
        "--fault-file",
        "/opt/openhop-fault/fault.json",
      ]
    volumes:
      - type: bind
        source: ./lab/openhop-radio/openhop_fault_proxy.py
        target: /opt/openhop-fault/openhop_fault_proxy.py
        read_only: true
      # The fault arguments live in a file, not in the command line, so the
      # proxy can be started by compose: a compose RUN would not give the
      # container the service's network alias, and the MEDRE client could
      # not resolve the proxy's name.
      - type: bind
        source: ./lab/state/openhop-fault
        target: /opt/openhop-fault
    networks: [openhop-radio]
    depends_on:
      openhop-repeater-a:
        condition: service_healthy

  openhop-bridge-probe:
    <<: *medre-openhop-build
    profiles: [openhop-bridge]
    # NO container_name: this service is run one-shot (`compose run`), and
    # `run` cannot use a fixed container name.
    restart: "no"
    user: "1000:1000"
    environment:
      # The expected '<node name>: ' prefix on the direction-2 arrival:
      # repeater A's COMPANION node name (the sending side stamps it on
      # the wire). bridge_up.sh exports it from the generated config.
      OPENHOP_BRIDGE_EXPECT_PREFIX: "${OPENHOP_BRIDGE_EXPECT_PREFIX:-}"
    command:
      [
        "python3",
        "/opt/openhop-bridge/openhop_bridge_probe.py",
        "--host-b",
        "openhop-repeater-b",
        "--port-b",
        "5000",
        "--host-peer",
        "meshtasticd-c-peer",
        "--port-peer",
        "4403",
      ]
    volumes:
      - type: bind
        source: ./lab/tools/openhop_bridge_probe.py
        target: /opt/openhop-bridge/openhop_bridge_probe.py
        read_only: true
    networks: [openhop-radio, mesh-c]
    depends_on:
      medre-openhop-bridge:
        condition: service_healthy
      meshtasticd-c-peer:
        condition: service_healthy

  lab-tools:
    build:
      context: .
      dockerfile: lab/tools/Dockerfile
    image: medre-lab/lab-tools:latest
    container_name: medre-lab-tools
    restart: unless-stopped
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    environment:
      TZ: UTC
      LAB_STATE_DIR: /lab-state
      LAB_LOGS_DIR: /lab-logs
    command: ["sleep", "infinity"]
    volumes:
      # Host-side lab state (runtime.json, generated configs) and logs.
      - ./lab/state:/lab-state
      - ./lab/logs:/lab-logs
      # Scenario suite layer (helpers run inside lab-tools).
      - ./scenarios:/scenarios:ro
      # Read-only views of relay state for SQLite assertions (message_map,
      # names tables) and credentials/device-id reads.
      - mmrelay-a-state:/state/mmrelay-a:ro
      - mmrelay-b-state:/state/mmrelay-b:ro
      # Read-only view of the medre relay state (medre.sqlite canonical
      # event/delivery mapping db, adapter stores) for the same assertions.
      - medre-state:/state/medre:ro
      # Read-only view of the normal-profile medre runtime state (fresh
      # volume; mapping db at /state/medre-normal/state/medre.sqlite).
      - medre-normal-state:/state/medre-normal:ro
    networks: [matrix, mesh-a, mesh-b, mesh-c]
    depends_on:
      synapse:
        condition: service_healthy

networks:
  matrix:
    name: medre-lab-matrix
  mesh-a:
    name: medre-lab-mesh-a
  mesh-b:
    name: medre-lab-mesh-b
  mesh-c:
    name: medre-lab-mesh-c
  # Private network for the openHop profile. The companion TCP port lives
  # here and is never published to the host: only openhop-repeater and
  # medre-openhop are attached to it.
  openhop:
    name: medre-lab-openhop
  # Private network for the openHop VIRTUAL RADIO profile. The relay and
  # both repeaters live here; nothing is published to the host.
  openhop-radio:
    name: medre-lab-openhop-radio

volumes:
  synapse-data:
    name: medre-lab-synapse-data
  mmrelay-a-state:
    name: medre-lab-mmrelay-a-state
  mmrelay-b-state:
    name: medre-lab-mmrelay-b-state
  medre-state:
    name: medre-lab-medre-state
  medre-normal-state:
    name: medre-lab-medre-normal-state
  openhop-repeater-data:
    name: medre-lab-openhop-repeater-data
  # Per-repeater state for the virtual radio profile: each repeater owns
  # its own identity file and SQLite store, so the two nodes stay distinct.
